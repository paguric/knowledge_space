[project]
name = "knowledge-space"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "paguric", email = "lpernisi05@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp-server",
    "knowledge-base",
    "watchdog>=6.0.0",
]

[tool.uv.workspace]
members = [
    "packages/mcp-server",
    "packages/knowledge-base",
]

[tool.uv.sources]
mcp-server = { workspace = true }
knowledge-base = { workspace = true }

[project.scripts]
knowledge-space = "knowledge_space:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

