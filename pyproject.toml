[project]
name = "knowledge-space"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "paguric", email = "lpernisi05@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp-server",
    "knowledge-base",
    "watchdog>=6.0.0",
    "typer>=0.15.0",
    "mcp>=1.0.0",
    "rank-bm25>=0.2.2",
    # Diretta solo per applicare [tool.uv.sources] (canale CPU) a torch,
    # che altrimenti resterebbe transitiva (sentence-transformers) e
    # verrebbe risolta da PyPI con CUDA. Il vincolo coincide con quello
    # di sentence-transformers: nessun effetto collaterale sulla versione.
    "torch>=2.0",
]

[tool.uv.workspace]
members = [
    "packages/mcp-server",
    "packages/knowledge-base",
]

[tool.uv.sources]
mcp-server = { workspace = true }
knowledge-base = { workspace = true }

# torch CPU-only di default (risparmio ~4 GB di librerie CUDA: nvidia-*, triton).
# Per usare la GPU con docling (vedi README, sezione Aggiornamento/GPU):
# commenta queste due righe e la sezione [[tool.uv.index]] qui sotto, poi
# `uv sync --extra docling`.
torch = { index = "pytorch-cpu" }

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[project.scripts]
knowledge-space = "knowledge_space.cli:app"
ks = "knowledge_space.cli:app"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[project.optional-dependencies]
remote = [
    "openai>=1.0.0",
    "cohere>=5.0.0",
    "voyageai>=0.1.0",
]
# Inoltro degli extra del package knowledge-base (lazy install):
# uv sync --extra <nome> dal root del repo.
docling = ["knowledge-base[docling]"]
pymupdf4llm = ["knowledge-base"]
neo4j = ["knowledge-base[neo4j]"]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "api: test di integrazione con API remote (richiede API key env var: COHERE_API_KEY, VOYAGE_API_KEY)",
    "neo4j: test di integrazione con Neo4j (richiede istanza Neo4j in esecuzione)",
]

