[project]
name = "knowledge-space"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "paguric", email = "lpernisi05@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    "mcp-server",
    "knowledge-base",
    "watchdog>=6.0.0",
]

[tool.uv.workspace]
members = [
    "packages/mcp-server",
    "packages/knowledge-base",
]

[tool.uv.sources]
mcp-server = { workspace = true }
knowledge-base = { workspace = true }

[project.scripts]
knowledge-space = "knowledge_space:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"

[project.optional-dependencies]
remote = [
    "openai>=1.0.0",
    "cohere>=5.0.0",
    "voyageai>=0.1.0",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]

[tool.pytest.ini_options]
markers = [
    "api: test di integrazione con API remote (richiede API key env var: COHERE_API_KEY, VOYAGE_API_KEY)",
    "neo4j: test di integrazione con Neo4j (richiede istanza Neo4j in esecuzione)",
]

