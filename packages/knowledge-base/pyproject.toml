[project]
name = "knowledge-base"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "paguric", email = "lpernisi05@gmail.com" }
]
requires-python = ">=3.14"
dependencies = [
    # Default hardcoded per l'ingestion (estrazione layout molto più
    # fedele di pdfminer: heading/liste reali, niente tabelle fantasma).
    "pymupdf4llm>=0.2.0",
    "watchdog>=6.0.0",
    "langchain>=1.3.11",
    "langchain-text-splitters>=1.1.2",
    "langchain-chroma>=1.1.0",
    "langchain-huggingface>=1.2.2",
    "chromadb>=1.5.9",
    "sentence-transformers>=5.6.0",
    "langdetect>=1.0.9",
    "tomli-w>=1.2.0",
    "openai>=1.0.0",
]

[project.optional-dependencies]
# Librerie di conversione opzionali: installate al primo utilizzo della
# relativa strategia di ingestion (uv sync --extra <name>).
docling = [
    "docling>=2.109.0",
]
# [pdf,docx,pptx,xlsx]: il package base di markitdown non legge PDF
# (pypdf) né Office — serve l'extra. Niente [all]: tirerebbe docling.
markitdown = [
    "markitdown[pdf,docx,pptx,xlsx]>=0.1.7",
]
# Driver Neo4j per il modulo grafo (ks graph): installato al primo
# utilizzo (uv sync --extra neo4j).
neo4j = [
    "neo4j>=5.0.0",
]
remote = [
    "openai>=1.0.0",
    "cohere>=5.0.0",
    "voyageai>=0.1.0",
]

[project.scripts]
knowledge-base = "knowledge_base:main"

[build-system]
requires = ["uv_build>=0.11.17,<0.12.0"]
build-backend = "uv_build"
